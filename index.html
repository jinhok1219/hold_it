<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화장실 참기 게임</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f8ff;
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            position: relative;
            padding-top: 20px;
        }

        #header {
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .time-warning { color: red; }

        /* 게이지 바 영역 */
        #gauge-container {
            width: 90%;
            height: 40px;
            background-color: #333;
            border-radius: 20px;
            margin: 0 auto;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* 굿, 퍼펙트 칸 */
        #zone-good {
            height: 100%;
            background-color: #4ade80;
            position: absolute;
            top: 0;
            border-radius: 5px;
        }

        #zone-perfect {
            height: 100%;
            background-color: #facc15;
            position: absolute;
            top: 0;
            border-radius: 5px;
            z-index: 5;
        }

        /* 움직이는 바 */
        #indicator {
            width: 8px;
            height: 48px;
            background-color: #ef4444;
            position: absolute;
            top: -4px;
            left: 0%;
            border-radius: 4px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* 방귀 이펙트 */
        .fart-cloud {
            position: absolute;
            height: 60px;
            width: 60px;
            background: radial-gradient(circle, rgba(139,69,19,0.9) 0%, rgba(107,142,35,0.7) 60%, rgba(0,0,0,0) 100%);
            border-radius: 50%;
            top: -10px;
            filter: blur(4px);
            z-index: 20;
            animation: fadeout 3s forwards;
        }

        @keyframes fadeout {
            0% { opacity: 1; transform: scale(1); }
            80% { opacity: 0.8; transform: scale(1.5); }
            100% { opacity: 0; transform: scale(2); }
        }

        /* 중앙 캐릭터 이미지 */
        #character-img {
            width: 250px;
            margin: 30px auto;
            display: block;
            border-radius: 20px;
            animation: shake 2s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* 판정 글씨 */
        #judgment-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            font-weight: 900;
            color: #fff;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            opacity: 0;
            z-index: 30;
            pointer-events: none;
            white-space: nowrap; 
        }

        @keyframes popup {
            0% { opacity: 1; transform: translate(-50%, -30%) scale(0.5); }
            50% { transform: translate(-50%, -60%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -80%) scale(1); }
        }

        .popup-anim {
            animation: popup 0.8s ease-out forwards;
        }

        #action-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s, background-color 0.2s;
        }

        #action-btn:active {
            transform: scale(0.95);
        }

        #game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            display: none;
        }

        #game-over-screen h1 { color: #facc15; font-size: 48px; margin-bottom: 10px; }
        #restart-btn {
            margin-top: 20px; padding: 10px 20px; font-size: 20px;
            background: #fff; color: #000; border: none; border-radius: 10px; cursor: pointer;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="header">
        <div>버틴 시간: <span id="score-display">0</span>초</div>
        <div id="time-display">10.0초</div>
    </div>

    <div id="gauge-container">
        <div id="zone-good"></div>
        <div id="zone-perfect"></div>
        <div id="indicator"></div>
    </div>

    <img id="character-img" src="image_eaacec.png" alt="호랑이 캐릭터">

    <button id="action-btn">참기!</button>
    <div id="judgment-text">PERFECT!</div>
</div>

<div id="game-over-screen">
    <h1>결국... 쌌다! 💩</h1>
    <h2>버틴 시간: <span id="final-score">0</span>초</h2>
    <button id="restart-btn">다시 도전하기</button>
</div>

<script>
    let timeLeft = 10.0;
    let totalTimeSurvived = 0.0;
    let isPlaying = true;
    
    let goodWidth = 20; 
    let perfectWidth = 6; 
    let speed = 40.0; 
    
    let indicatorPos = 0; 
    let direction = 1; 
    let targetStart = 0; 
    let perfectStart = 0; 

    let gameLoop;
    let lastTime = 0;

    const timeDisplay = document.getElementById('time-display');
    const scoreDisplay = document.getElementById('score-display');
    const indicator = document.getElementById('indicator');
    const zoneGood = document.getElementById('zone-good');
    const zonePerfect = document.getElementById('zone-perfect');
    const actionBtn = document.getElementById('action-btn');
    const judgmentText = document.getElementById('judgment-text');
    const gaugeContainer = document.getElementById('gauge-container');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalScore = document.getElementById('final-score');
    const restartBtn = document.getElementById('restart-btn');

    function generateTarget() {
        let difficultyFactor = totalTimeSurvived / 60;
        if (difficultyFactor > 1) difficultyFactor = 1;

        goodWidth = 20 - (14 * difficultyFactor); 
        perfectWidth = 6 - (5 * difficultyFactor); 

        targetStart = Math.random() * (100 - goodWidth);
        perfectStart = targetStart + (goodWidth / 2) - (perfectWidth / 2);

        zoneGood.style.left = targetStart + '%';
        zoneGood.style.width = goodWidth + '%';
        
        zonePerfect.style.left = perfectStart + '%';
        zonePerfect.style.width = perfectWidth + '%';
    }

    function update(timestamp) {
        if (!isPlaying) return;

        const deltaTime = (timestamp - lastTime) / 1000;
        lastTime = timestamp;

        if (deltaTime < 0.1) {
            timeLeft -= deltaTime;
            totalTimeSurvived += deltaTime;

            if (timeLeft <= 0) {
                gameOver();
                return;
            }

            let difficultyFactor = totalTimeSurvived / 60;
            if (difficultyFactor > 1) difficultyFactor = 1;
            speed = 40 + (200 * difficultyFactor); 

            indicatorPos += (speed * deltaTime * direction);
            
            if (indicatorPos >= 100) {
                indicatorPos = 100;
                direction = -1;
            } else if (indicatorPos <= 0) {
                indicatorPos = 0;
                direction = 1;
            }

            timeDisplay.textContent = timeLeft.toFixed(1) + '초';
            if (timeLeft <= 3) timeDisplay.classList.add('time-warning');
            else timeDisplay.classList.remove('time-warning');

            scoreDisplay.textContent = totalTimeSurvived.toFixed(0);
            indicator.style.left = indicatorPos + '%';
        }

        gameLoop = requestAnimationFrame(update);
    }

    function showJudgment(text, color) {
        judgmentText.textContent = text;
        judgmentText.style.color = color;
        judgmentText.classList.remove('popup-anim');
        void judgmentText.offsetWidth;
        judgmentText.classList.add('popup-anim');
    }

    function createFart() {
        const fart = document.createElement('div');
        fart.className = 'fart-cloud';
        const randomX = Math.random() * 90;
        fart.style.left = randomX + '%';
        gaugeContainer.appendChild(fart);

        setTimeout(() => {
            if(fart.parentElement) fart.remove();
        }, 3000);
    }

    actionBtn.addEventListener('click', () => {
        if (!isPlaying) return;

        // [핵심 패치 2] 빨간 바의 '정중앙(Center)' 픽셀을 구해서 정확하게 판정!
        const indicatorRect = indicator.getBoundingClientRect();
        const gaugeRect = gaugeContainer.getBoundingClientRect();
        const indWidthPct = (indicatorRect.width / gaugeRect.width) * 100; 

        // 빨간 바의 정중앙 좌표 (%)
        const indCenter = indicatorPos + (indWidthPct / 2);

        const perfectRight = perfectStart + perfectWidth;
        const goodRight = targetStart + goodWidth;

        // 중심점이 노란색 안에 있으면 퍼펙트, 초록색 안에만 있으면 굿!
        const isPerfect = (indCenter >= perfectStart) && (indCenter <= perfectRight);
        const isGood = (indCenter >= targetStart) && (indCenter <= goodRight);

        if (isPerfect) {
            timeLeft += 5;
            showJudgment("PERFECT! +5초", "#facc15");
        } else if (isGood) {
            timeLeft += 3;
            showJudgment("GOOD! +3초", "#4ade80");
        } else {
            timeLeft -= 1; 
            createFart();
            showJudgment("MISS! -1초", "#ef4444");
        }

        generateTarget();
    });

    function gameOver() {
        isPlaying = false;
        timeDisplay.textContent = "0.0초";
        gameOverScreen.style.display = 'flex';
        finalScore.textContent = totalTimeSurvived.toFixed(1);
    }

    restartBtn.addEventListener('click', () => {
        timeLeft = 10.0;
        totalTimeSurvived = 0;
        speed = 40;
        isPlaying = true;
        gameOverScreen.style.display = 'none';
        
        document.querySelectorAll('.fart-cloud').forEach(el => el.remove());

        generateTarget();
        lastTime = performance.now();
        requestAnimationFrame(update);
    });

    generateTarget();
    lastTime = performance.now();
    gameLoop = requestAnimationFrame(update);
</script>

</body>
</html>
