<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화장실 참기 게임</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f8ff;
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            position: relative;
            padding-top: 20px;
        }

        #header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 20px;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .score-container {
            text-align: left;
        }

        .real-time-clock {
            font-size: 14px;
            color: #6b7280;
            font-weight: normal;
            margin-top: 4px;
        }

        .time-warning { color: red; }

        /* 게이지 바 영역 */
        #gauge-container {
            width: 90%;
            height: 40px;
            background-color: #333;
            border-radius: 20px;
            margin: 0 auto;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* 굿, 퍼펙트 칸 */
        #zone-good {
            height: 100%;
            background-color: #4ade80;
            position: absolute;
            top: 0;
            border-radius: 5px;
        }

        #zone-perfect {
            height: 100%;
            background-color: #facc15;
            position: absolute;
            top: 0;
            border-radius: 5px;
            z-index: 5;
        }

        /* 움직이는 바 */
        #indicator {
            width: 4px;
            height: 48px;
            background-color: #ef4444;
            position: absolute;
            top: -4px;
            left: 0%;
            border-radius: 2px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            transform: translateX(-50%);
            z-index: 10;
        }

        /* 방귀 이펙트 */
        .fart-cloud {
            position: absolute;
            height: 60px;
            width: 60px;
            background: radial-gradient(circle, rgba(139,69,19,0.9) 0%, rgba(107,142,35,0.7) 60%, rgba(0,0,0,0) 100%);
            border-radius: 50%;
            top: -10px;
            filter: blur(4px);
            z-index: 20;
            animation: fadeout 3s forwards;
        }

        @keyframes fadeout {
            0% { opacity: 1; transform: scale(1); }
            80% { opacity: 0.8; transform: scale(1.5); }
            100% { opacity: 0; transform: scale(2); }
        }

        /* 중앙 캐릭터 이미지 */
        #character-img {
            width: 250px;
            margin: 30px auto;
            display: block;
            border-radius: 20px;
            animation: shake 2s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* 판정 글씨 */
        #judgment-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            font-weight: 900;
            color: #fff;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            opacity: 0;
            z-index: 30;
            pointer-events: none;
            white-space: nowrap; 
        }

        @keyframes popup {
            0% { opacity: 1; transform: translate(-50%, -30%) scale(0.5); }
            50% { transform: translate(-50%, -60%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -80%) scale(1); }
        }

        .popup-anim {
            animation: popup 0.8s ease-out forwards;
        }

        #action-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s, background-color 0.2s;
        }

        #action-btn:active {
            transform: scale(0.95);
        }

        /* 시작 화면 CSS */
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200; /* 결과창보다 더 위에 */
            padding: 20px;
            box-sizing: border-box;
        }

        #start-screen h1 {
            font-size: 48px;
            color: #facc15;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        #start-btn {
            padding: 15px 40px;
            font-size: 26px;
            font-weight: bold;
            background: #4ade80;
            color: #000;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #start-btn:active {
            transform: scale(0.95);
        }

        /* 결과창 CSS */
        #game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            display: none;
            padding: 20px;
            box-sizing: border-box;
        }

        #game-over-img {
            max-width: 90%;
            max-height: 45vh; 
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #game-over-screen h2 { 
            margin-bottom: 10px; 
            font-size: 32px;
            color: #facc15;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        
        #game-over-time { 
            font-size: 18px; 
            color: #cbd5e1; 
            margin-bottom: 30px; 
            font-weight: normal; 
        }

        #restart-btn {
            padding: 15px 30px; 
            font-size: 22px;
            font-weight: bold;
            background: #fff; 
            color: #000; 
            border: none; 
            border-radius: 15px; 
            cursor: pointer;
            transition: transform 0.1s;
        }

        #restart-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="header">
        <div class="score-container">
            <div>버틴 시간: <span id="score-display">0.0</span>초</div>
            <div id="live-clock-header" class="real-time-clock">KST --:--:--</div>
        </div>
        <div id="time-display">10.0초</div>
    </div>

    <div id="gauge-container">
        <div id="zone-good"></div>
        <div id="zone-perfect"></div>
        <div id="indicator"></div>
    </div>

    <!-- 인게임 캐릭터 이미지 -->
    <img id="character-img" src="image_eaacec.jpg" alt="호랑이 캐릭터">

    <button id="action-btn">참기!</button>
    <div id="judgment-text">PERFECT!</div>
</div>

<!-- 최초 시작 화면 -->
<div id="start-screen">
    <h1>화장실 참기 🚽</h1>
    <button id="start-btn">게임 시작</button>
</div>

<!-- 게임 오버 결과창 화면 -->
<div id="game-over-screen">
    <img id="game-over-img" src="image_074948.jpg" alt="결국 쌌다">
    <h2>버틴 시간: <span id="final-score">0.0</span>초</h2>
    <div id="game-over-time">기록 시간: KST --:--:--</div>
    <button id="restart-btn">다시 도전하기</button>
</div>

<script>
    let timeLeft = 10.0;
    let totalTimeSurvived = 0.0;
    
    // 처음에 접속했을 때는 게임이 정지된 상태(false)로 둡니다.
    let isPlaying = false; 
    
    let goodWidth = 20; 
    let perfectWidth = 6; 
    let speed = 40.0; 
    
    let indicatorPos = 0; 
    let direction = 1; 
    let targetStart = 0; 
    let perfectStart = 0; 

    let gameLoop;
    let lastTime = 0;

    const timeDisplay = document.getElementById('time-display');
    const scoreDisplay = document.getElementById('score-display');
    const indicator = document.getElementById('indicator');
    const zoneGood = document.getElementById('zone-good');
    const zonePerfect = document.getElementById('zone-perfect');
    const actionBtn = document.getElementById('action-btn');
    const judgmentText = document.getElementById('judgment-text');
    const gaugeContainer = document.getElementById('gauge-container');
    
    // 화면 요소들
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalScore = document.getElementById('final-score');
    const restartBtn = document.getElementById('restart-btn');
    const liveClockHeader = document.getElementById('live-clock-header');
    const gameOverTime = document.getElementById('game-over-time');

    // 스페이스바 입력 무시 로직 (스크롤 및 버튼 오작동 방지)
    window.addEventListener('keydown', function(e) {
        if (e.code === 'Space' || e.key === ' ') {
            e.preventDefault(); 
        }
    });

    // 실시간 시계 로직
    function updateRealTimeClock() {
        const now = new Date();
        const kstString = now.toLocaleString('ko-KR', {
            timeZone: 'Asia/Seoul',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false
        });
        
        liveClockHeader.textContent = `KST ${kstString}`;
    }

    setInterval(updateRealTimeClock, 1000);
    updateRealTimeClock(); 

    function generateTarget() {
        let difficultyFactor = totalTimeSurvived / 60;
        if (difficultyFactor > 1) difficultyFactor = 1;

        goodWidth = 20 - (14 * difficultyFactor); 
        perfectWidth = 6 - (5 * difficultyFactor); 

        targetStart = Math.random() * (100 - goodWidth);
        perfectStart = targetStart + (goodWidth / 2) - (perfectWidth / 2);

        zoneGood.style.left = targetStart + '%';
        zoneGood.style.width = goodWidth + '%';
        
        zonePerfect.style.left = perfectStart + '%';
        zonePerfect.style.width = perfectWidth + '%';
    }

    function update(timestamp) {
        if (!isPlaying) return;

        const deltaTime = (timestamp - lastTime) / 1000;
        lastTime = timestamp;

        if (deltaTime < 0.1) {
            timeLeft -= deltaTime;
            totalTimeSurvived += deltaTime;

            if (timeLeft <= 0) {
                gameOver();
                return;
            }

            let difficultyFactor = totalTimeSurvived / 60;
            if (difficultyFactor > 1) difficultyFactor = 1;
            speed = 40 + (200 * difficultyFactor); 

            indicatorPos += (speed * deltaTime * direction);
            
            if (indicatorPos >= 100) {
                indicatorPos = 100;
                direction = -1;
            } else if (indicatorPos <= 0) {
                indicatorPos = 0;
                direction = 1;
            }

            timeDisplay.textContent = timeLeft.toFixed(1) + '초';
            if (timeLeft <= 3) timeDisplay.classList.add('time-warning');
            else timeDisplay.classList.remove('time-warning');

            scoreDisplay.textContent = totalTimeSurvived.toFixed(1);
            indicator.style.left = indicatorPos + '%';
        }

        gameLoop = requestAnimationFrame(update);
    }

    function showJudgment(text, color) {
        judgmentText.textContent = text;
        judgmentText.style.color = color;
        judgmentText.classList.remove('popup-anim');
        void judgmentText.offsetWidth;
        judgmentText.classList.add('popup-anim');
    }

    function createFart() {
        const fart = document.createElement('div');
        fart.className = 'fart-cloud';
        const randomX = Math.random() * 90;
        fart.style.left = randomX + '%';
        gaugeContainer.appendChild(fart);

        setTimeout(() => {
            if(fart.parentElement) fart.remove();
        }, 3000);
    }

    // [핵심 추가] 최초 게임 시작 버튼 클릭 이벤트
    startBtn.addEventListener('click', () => {
        startBtn.blur(); // 스페이스바 방지
        startScreen.style.display = 'none'; // 시작 화면 숨기기
        isPlaying = true; // 게임 상태 활성화
        lastTime = performance.now(); // 시간 초기화
        gameLoop = requestAnimationFrame(update); // 루프 시작!
    });

    // 인게임 참기 버튼 클릭 이벤트
    actionBtn.addEventListener('click', () => {
        actionBtn.blur();

        if (!isPlaying) return;

        const isPerfect = (indicatorPos >= perfectStart) && (indicatorPos <= (perfectStart + perfectWidth));
        const isGood = (indicatorPos >= targetStart) && (indicatorPos <= (targetStart + goodWidth));

        if (isPerfect) {
            timeLeft += 5;
            showJudgment("PERFECT! +5초", "#facc15");
        } else if (isGood) {
            timeLeft += 3;
            showJudgment("GOOD! +3초", "#4ade80");
        } else {
            timeLeft -= 2; 
            createFart();
            showJudgment("MISS! -2초", "#ef4444");
        }

        generateTarget();
    });

    function gameOver() {
        isPlaying = false;
        timeDisplay.textContent = "0.0초";
        gameOverScreen.style.display = 'flex';
        finalScore.textContent = totalTimeSurvived.toFixed(1);
        
        const now = new Date();
        const kstString = now.toLocaleString('ko-KR', {
            timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        });
        gameOverTime.textContent = `기록 시간: KST ${kstString}`;
    }

    // 재도전 버튼 클릭 이벤트
    restartBtn.addEventListener('click', () => {
        restartBtn.blur();
        timeLeft = 10.0;
        totalTimeSurvived = 0;
        speed = 40;
        isPlaying = true;
        gameOverScreen.style.display = 'none';
        
        document.querySelectorAll('.fart-cloud').forEach(el => el.remove());

        generateTarget();
        lastTime = performance.now();
        requestAnimationFrame(update);
    });

    // 페이지 로드 시 타겟만 미리 그려놓고 게임은 멈춰둡니다. (Start 버튼을 눌러야 진행)
    generateTarget();
</script>

</body>
</html>
